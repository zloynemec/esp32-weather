; Copy this file to platformio_override.ini for a physical ESP32.
; platformio_override.ini is ignored by Git because it may contain Wi-Fi secrets.

[env:esp32dev]
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D WEATHER_WIFI_SSID=\"your-wifi-name\"
  -D WEATHER_WIFI_PASSWORD=\"your-wifi-password\"
  -D WEATHER_SERVER_URL=\"http://192.168.1.10:3000/api/v1/measurements\"
  -D WEATHER_DEVICE_ID=\"esp32-physical-01\"
  -D WEATHER_DS18B20_DEVICE_1_ID=\"esp32-physical-ds18b20-01\"
  -D WEATHER_DS18B20_DEVICE_2_ID=\"esp32-physical-ds18b20-02\"
